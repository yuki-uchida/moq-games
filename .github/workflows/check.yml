name: Checks and Pages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            .sdk-cache
            .generated/moqt-sdk
            ~/.cargo/registry
            ~/.cargo/git
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs') }}
      - run: node scripts/setup-sdk.mjs
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:core
      - name: Test title and real-model contracts
        run: npx vitest run examples/games/tower_diffence_with_jev/tests/battle-music.test.ts examples/games/tower_diffence_with_jev/tests/title-screen.test.ts examples/games/tower_diffence_with_jev/tests/model-rendering.test.ts examples/games/tower_diffence_with_jev/tests/model-catalog.test.ts examples/games/tower_diffence_with_jev/tests/compact-field.test.ts examples/games/tower_diffence_with_jev/tests/road-placement.test.ts examples/games/tower_diffence_with_jev/tests/road-geometry-cache.test.ts examples/games/tower_diffence_with_jev/tests/battlefield-presentation.test.ts tests/board-camera-depth.test.ts --maxWorkers=1
      - run: node --test tests/landing-catalog.test.mjs tests/tower-viewer-catalog.test.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: node scripts/prepare-pages.mjs
      - run: test -s dist/THIRD-PARTY-NOTICES.txt && test -s .generated/moqt-sdk/provenance.json
      - name: Install Chromium for public-build browser tests
        run: npx playwright install --with-deps chromium
      - name: Test the Pages build in Chromium
        run: npx playwright test --config playwright.pages.config.ts
      - name: Upload browser report, screenshots, and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-validation-${{ github.sha }}
          path: |
            playwright-report/pages/
            test-results/pages/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
