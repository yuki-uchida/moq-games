name: Checks and Pages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            .sdk-cache
            .generated/moqt-sdk
            ~/.cargo/registry
            ~/.cargo/git
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs') }}
      - run: node scripts/setup-sdk.mjs
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:core
      - name: Test title and real-model contracts
        run: npx vitest run examples/games/tower_diffence_with_jev/tests/special-abilities.test.ts examples/games/tower_diffence_with_jev/tests/special-visual.test.ts examples/games/tower_diffence_with_jev/tests/battle-music.test.ts examples/games/tower_diffence_with_jev/tests/title-screen.test.ts examples/games/tower_diffence_with_jev/tests/model-rendering.test.ts examples/games/tower_diffence_with_jev/tests/fade-programs.test.ts examples/games/tower_diffence_with_jev/tests/defender-preparation.test.ts examples/games/tower_diffence_with_jev/tests/campaign-preparation.test.ts examples/games/tower_diffence_with_jev/tests/dq-scratch.test.ts examples/games/tower_diffence_with_jev/tests/model-catalog.test.ts examples/games/tower_diffence_with_jev/tests/model-environment-lighting.test.ts examples/games/tower_diffence_with_jev/tests/ogre-material-color.test.ts examples/games/tower_diffence_with_jev/tests/persist.test.ts examples/games/tower_diffence_with_jev/tests/audio-mobile-unlock.test.ts examples/games/tower_diffence_with_jev/tests/sound-status.test.ts examples/games/tower_diffence_with_jev/tests/compact-field.test.ts examples/games/tower_diffence_with_jev/tests/road-placement.test.ts examples/games/tower_diffence_with_jev/tests/road-geometry-cache.test.ts examples/games/tower_diffence_with_jev/tests/forecast-query-snapshot.test.ts examples/games/tower_diffence_with_jev/tests/battlefield-presentation.test.ts tests/board-camera-depth.test.ts examples/games/tower_diffence_with_jev/tests/enemy-checkpoint.test.ts examples/games/tower_diffence_with_jev/tests/new-enemies.test.ts examples/games/tower_diffence_with_jev/tests/new-enemy-forecast-snapshot.test.ts examples/games/tower_diffence_with_jev/tests/new-enemy-models.test.ts examples/games/tower_diffence_with_jev/tests/approved-maze.test.ts examples/games/tower_diffence_with_jev/tests/model-viewer.test.ts tests/runtime-model-optimization.test.ts examples/games/tower_diffence_with_jev/tests/battle-clock.test.ts --maxWorkers=1
      - run: node --test tests/landing-catalog.test.mjs tests/tower-viewer-catalog.test.mjs tests/forecast-reference-catalog.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline bot test dependencies
        run: python -m pip install httpx==0.28.1 pydantic==2.13.4
      - name: Test offline bot and serialized HP contracts
        run: python -m unittest discover -s tests/bot -v
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify exact forecast equivalence
        run: node scripts/validate-forecast-performance.mjs
      - run: npm run build
      - run: node scripts/prepare-pages.mjs
      - run: test -s dist/THIRD-PARTY-NOTICES.txt && test -s .generated/moqt-sdk/provenance.json
      # Transfer the exact prepared output, rather than rebuilding per browser runner.
      - name: Upload verified SDK for browser runners
        uses: actions/upload-artifact@v4
        with:
          name: pages-sdk-${{ github.sha }}
          path: .generated/moqt-sdk/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Keep both reports when a shard fails. One WebGL worker per independent runner.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore verified SDK
        uses: actions/download-artifact@v4
        with:
          name: pages-sdk-${{ github.sha }}
          path: .generated/moqt-sdk
      - run: npm ci --ignore-scripts
      - name: Download the exact Pages build
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .pages-artifact
      - name: Restore prepared Pages output
        run: |
          mkdir -p dist
          tar -xf .pages-artifact/artifact.tar -C dist
          test -s dist/THIRD-PARTY-NOTICES.txt
      - name: Install Chromium for public-build browser tests
        run: npx playwright install --with-deps chromium
      - name: Test the Pages build in Chromium
        run: npx playwright test --config playwright.pages.config.ts --shard=${{ matrix.shard }}/2
      - name: Upload shard report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-validation-${{ github.sha }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/pages/
            test-results/pages/
          if-no-files-found: warn
          retention-days: 14
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
