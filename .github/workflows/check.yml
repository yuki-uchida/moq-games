name: Checks and Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'
permissions:
  contents: read
# A newer push to the same ref supersedes the running checks; Pages still publishes only a fully passing run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      tower: ${{ steps.scope.outputs.tower }}
      ember: ${{ steps.scope.outputs.ember }}
      life: ${{ steps.scope.outputs.life }}
      debug: ${{ steps.scope.outputs.debug }}
      bot: ${{ steps.scope.outputs.bot }}
      audit: ${{ steps.scope.outputs.audit }}
      ci: ${{ steps.scope.outputs.ci }}
      pages: ${{ steps.scope.outputs.pages }}
      browser: ${{ steps.scope.outputs.browser }}
      shards: ${{ steps.scope.outputs.shards }}
      pagesBrowser: ${{ steps.scope.outputs.pagesBrowser }}
      unit: ${{ steps.scope.outputs.unit }}
      node: ${{ steps.scope.outputs.node }}
      laneNode: ${{ steps.scope.outputs.laneNode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/public/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/ci-scope.test.mjs
      - id: scope
        run: node scripts/ci-scope.mjs
  build:
    # Starts beside the change scoping; the scope only decides whether its output is tested and published.
    # Only the prepared Pages output and SDK gate the browser shards, so produce them first and
    # run the typecheck, lint and unit suites beside them instead of ahead of them.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        id: sdk-generated
        with:
          path: .generated/moqt-sdk
          key: sdk-generated-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs', 'scripts/sdk-source-text.mjs') }}
      - uses: actions/cache@v4
        if: steps.sdk-generated.outputs.cache-hit != 'true'
        with:
          path: |
            .sdk-cache
            .generated/moqt-sdk
            ~/.cargo/registry
            ~/.cargo/git
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs', 'scripts/sdk-source-text.mjs') }}
      - run: node scripts/setup-sdk.mjs
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/prepare-pages.mjs
      - run: node --test tests/pages-output.test.mjs
      - run: test -s dist/THIRD-PARTY-NOTICES.txt && test -s .generated/moqt-sdk/provenance.json
      - name: Preserve verified model sidecar digests
        uses: actions/upload-artifact@v4
        with:
          name: model-sidecar-digests-${{ github.sha }}
          path: .build/model-sidecar-digests.json
          include-hidden-files: true
          if-no-files-found: error
      # Transfer the exact prepared output, rather than rebuilding per browser runner.
      - name: Upload verified SDK for browser runners
        uses: actions/upload-artifact@v4
        with:
          name: pages-sdk-${{ github.sha }}
          path: .generated/moqt-sdk/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  check:
    needs: changes
    if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.debug == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        id: sdk-generated
        with:
          path: .generated/moqt-sdk
          key: sdk-generated-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs', 'scripts/sdk-source-text.mjs') }}
      - uses: actions/cache@v4
        if: steps.sdk-generated.outputs.cache-hit != 'true'
        with:
          path: |
            .sdk-cache
            .generated/moqt-sdk
            ~/.cargo/registry
            ~/.cargo/git
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs', 'scripts/sdk-source-text.mjs') }}
      - run: node scripts/setup-sdk.mjs
      - run: npm ci --ignore-scripts
      - run: node --test tests/ci-scope.test.mjs
      - run: npm run typecheck
        if: needs.changes.outputs.runtime == 'true'
      - run: npx tsc --noEmit -p examples/games/ember-grid/tsconfig.json
        if: needs.changes.outputs.ember == 'true'
      - run: npm run lint
        if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.debug == 'true'
      - name: Node contract tests
        if: needs.changes.outputs.node != ''
        run: node --test ${{ needs.changes.outputs.node }}
      - run: npm run typecheck:tower-debug
        if: needs.changes.outputs.debug == 'true'
      - run: npm run test:tower-debug
        if: needs.changes.outputs.debug == 'true'
  lane-node:
    needs: changes
    if: needs.changes.outputs.laneNode != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/public/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        id: sdk-generated
        with:
          path: .generated/moqt-sdk
          key: sdk-generated-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs', 'scripts/sdk-source-text.mjs') }}
      - uses: actions/cache@v4
        if: steps.sdk-generated.outputs.cache-hit != 'true'
        with:
          path: |
            .sdk-cache
            .generated/moqt-sdk
            ~/.cargo/registry
            ~/.cargo/git
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs', 'scripts/sdk-source-text.mjs') }}
      - run: node scripts/setup-sdk.mjs
      - run: npm ci --ignore-scripts
      - name: Lane Node tests
        run: node --test --test-shard=${{ matrix.shard }}/${{ strategy.job-total }} ${{ needs.changes.outputs.laneNode }}
  unit:
    needs: changes
    if: needs.changes.outputs.unit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        id: sdk-generated
        with:
          path: .generated/moqt-sdk
          key: sdk-generated-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs', 'scripts/sdk-source-text.mjs') }}
      - uses: actions/cache@v4
        if: steps.sdk-generated.outputs.cache-hit != 'true'
        with:
          path: |
            .sdk-cache
            .generated/moqt-sdk
            ~/.cargo/registry
            ~/.cargo/git
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs', 'scripts/sdk-source-text.mjs') }}
      - run: node scripts/setup-sdk.mjs
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        if: contains(needs.changes.outputs.unit, 'examples/games/yoru-no-yashiki/tests')
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for browser-backed unit tests
        if: contains(needs.changes.outputs.unit, 'examples/games/yoru-no-yashiki/tests')
        run: node scripts/ci-install-chromium.mjs
      - name: Unit tests
        run: npx vitest run ${{ needs.changes.outputs.unit }} --shard=${{ matrix.shard }}/${{ strategy.job-total }} --maxWorkers=4
  life-browser:
    needs: changes
    if: needs.changes.outputs.life == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/public/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        id: sdk-generated
        with:
          path: .generated/moqt-sdk
          key: sdk-generated-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs', 'scripts/sdk-source-text.mjs') }}
      - uses: actions/cache@v4
        if: steps.sdk-generated.outputs.cache-hit != 'true'
        with:
          path: |
            .sdk-cache
            .generated/moqt-sdk
            ~/.cargo/registry
            ~/.cargo/git
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs', 'scripts/sdk-source-text.mjs') }}
      - run: node scripts/setup-sdk.mjs
      - run: npm ci --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for life-survivors
        run: node scripts/ci-install-chromium.mjs
      # Heavy tests share title prefixes, so deal the sorted names in turn (the Pages weights list none of these).
      - name: Select this shard's life-survivors tests
        shell: bash
        run: |
          npx playwright test --config playwright.life-survivors.config.ts --list |
            node scripts/ci-pages-shard.mjs ${{ matrix.shard }} ${{ strategy.job-total }} > shard-tests.txt
          cat shard-tests.txt
          test -s shard-tests.txt
      - name: Test life-survivors in Chromium
        run: npm run e2e:life-survivors -- --test-list shard-tests.txt --workers=2
      - name: Upload life-survivors browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: life-survivors-browser-${{ github.sha }}-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
  slow-checks:
    needs: changes
    if: needs.changes.outputs.tower == 'true' || needs.changes.outputs.bot == 'true' || needs.changes.outputs.audit == 'true'
    # Independent of the Pages artifact, so these run beside build instead of delaying the browser shards.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        id: sdk-generated
        with:
          path: .generated/moqt-sdk
          key: sdk-generated-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs', 'scripts/sdk-source-text.mjs') }}
      - uses: actions/cache@v4
        if: steps.sdk-generated.outputs.cache-hit != 'true'
        with:
          path: |
            .sdk-cache
            .generated/moqt-sdk
            ~/.cargo/registry
            ~/.cargo/git
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdk/source.json', 'sdk/package.json', 'scripts/setup-sdk.mjs', 'scripts/sdk-source-text.mjs') }}
      - run: node scripts/setup-sdk.mjs
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
        if: needs.changes.outputs.audit == 'true'
      - name: Verify exact forecast equivalence
        if: needs.changes.outputs.tower == 'true'
        run: node scripts/validate-forecast-performance.mjs
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.bot == 'true'
        with:
          python-version: '3.12'
      - name: Install offline bot test dependencies
        if: needs.changes.outputs.bot == 'true'
        run: python -m pip install httpx==0.28.1 pydantic==2.13.4
      - name: Test offline bot and serialized HP contracts
        if: needs.changes.outputs.bot == 'true'
        run: python -m unittest discover -s tests/bot -v
  browser:
    needs: [changes, build]
    if: needs.changes.outputs.pagesBrowser == 'true'
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
      MESA_SHADER_CACHE_DISABLE: 'false'
    timeout-minutes: 30
    strategy:
      # Keep every report when a shard fails. Three WebGL workers per independent runner.
      # Cold software-GPU starts prepare the full roster, so use small independent shards:
      # the longest single test runs about 3.5 minutes, the whole suite 52-58 minutes, and a slow
      # runner stretches a shard by half again, so keep the per-shard load near 3.5 minutes.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/public/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore verified SDK
        uses: actions/download-artifact@v4
        with:
          name: pages-sdk-${{ github.sha }}
          path: .generated/moqt-sdk
      - run: npm ci --ignore-scripts
      - name: Download the exact Pages build
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .pages-artifact
      - name: Restore prepared Pages output
        run: |
          mkdir -p dist
          tar -xf .pages-artifact/artifact.tar -C dist
          test -s dist/THIRD-PARTY-NOTICES.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for public-build browser tests
        run: node scripts/ci-install-chromium.mjs
      - name: Install Mesa and Xvfb
        run: node scripts/ci-apt-install.mjs -y libgl1-mesa-dri libegl1 xvfb
      - name: Identify Mesa shader cache platform
        id: mesa-cache-platform
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { createHash } = require('node:crypto')
          const { appendFileSync } = require('node:fs')
          const { cpus } = require('node:os')
          const mesa = execFileSync('dpkg-query', ['-W', '-f=${Version}', 'libgl1-mesa-dri'], { encoding: 'utf8' }).trim()
          const cpu = cpus()[0]?.model?.trim()
          if (!/^[0-9][^\s]*$/.test(mesa)) throw new Error('Missing or invalid Mesa package version')
          if (!cpu || /unknown|unidentified|not specified|^n\/a$/i.test(cpu)) throw new Error('Missing or unknown CPU model')
          const hash = (value) => createHash('sha256').update(value).digest('hex').slice(0, 16)
          appendFileSync(process.env.GITHUB_OUTPUT, 'mesa=' + hash(mesa) + '\ncpu=' + hash(cpu) + '\n')
          NODE
      - name: Restore Mesa shader cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/moq-mesa-shader-cache
          # Reuse compatible shards (including old keys), but save each shard separately.
          key: moq-mesa-shader-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mesa-cache-platform.outputs.mesa }}-${{ steps.mesa-cache-platform.outputs.cpu }}-${{ hashFiles('package-lock.json') }}-${{ matrix.shard }}-cache
          restore-keys: |
            moq-mesa-shader-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mesa-cache-platform.outputs.mesa }}-${{ steps.mesa-cache-platform.outputs.cpu }}-${{ hashFiles('package-lock.json') }}-
      # Balance collected tests by measured duration so cold starts do not bunch up.
      - name: Select this shard's tests
        id: shard
        shell: bash
        run: |
          npx playwright test --config playwright.pages.config.ts ${{ needs.changes.outputs.browser }} --list |
            node scripts/ci-pages-shard.mjs ${{ matrix.shard }} ${{ strategy.job-total }} --workers=3 > shard-tests.txt
          cat shard-tests.txt
          if test -s shard-tests.txt; then echo 'has-tests=true' >> "$GITHUB_OUTPUT"; fi
      - name: Test the Pages build in Chromium
        if: steps.shard.outputs.has-tests == 'true'
        env:
          MESA_SHADER_CACHE_DIR: ${{ runner.temp }}/moq-mesa-shader-cache
        run: xvfb-run -a npx playwright test --config playwright.pages.config.ts --test-list shard-tests.txt --workers=3
      - name: Upload shard report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-validation-${{ github.sha }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/pages/
            test-results/pages/
          if-no-files-found: warn
          retention-days: 14
  deploy:
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' && needs.changes.outputs.pages == 'true' && needs.build.result == 'success' &&
      needs.check.result == 'success' &&
      (needs.lane-node.result == 'success' || (needs.lane-node.result == 'skipped' && needs.changes.outputs.laneNode == '')) &&
      (needs.unit.result == 'success' || (needs.unit.result == 'skipped' && needs.changes.outputs.unit == '')) &&
      (needs.life-browser.result == 'success' || needs.life-browser.result == 'skipped') &&
      (needs.slow-checks.result == 'success' || needs.slow-checks.result == 'skipped') &&
      (needs.browser.result == 'success' || needs.browser.result == 'skipped')
    needs: [changes, build, check, lane-node, unit, life-browser, slow-checks, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/public/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore verified model sidecar digests
        uses: actions/download-artifact@v4
        with:
          name: model-sidecar-digests-${{ github.sha }}
          path: .verified-model-sidecars
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published motion assets and pages
        if: needs.changes.outputs.tower == 'true'
        run: node scripts/verify-published-motions.mjs '${{ steps.deployment.outputs.page_url }}' .verified-model-sidecars/model-sidecar-digests.json

      - name: Verify published refined motion overlays
        if: needs.changes.outputs.tower == 'true'
        run: node scripts/verify-published-refined-motions.mjs '${{ steps.deployment.outputs.page_url }}'
