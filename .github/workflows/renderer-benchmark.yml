name: Renderer benchmark
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Checks and Pages main push run ID with a successful build
        required: true
        type: string
      scenario:
        description: Original test scenario
        required: true
        type: choice
        default: normal-game
        options: [normal-game, meshopt, extra, concurrency]
      channel:
        description: Headless Chromium distribution
        required: true
        type: choice
        default: shell
        options: [shell, chromium]
      browser_mode:
        description: Browser process ownership (shared only for concurrency/chromium/gl)
        required: true
        type: choice
        default: dedicated
        options: [dedicated, shared]
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.scenario == 'concurrency' && '["gl"]' || '["swiftshader","gl","vulkan"]') }}
        workers: ${{ fromJSON(inputs.scenario == 'concurrency' && '[1,2]' || '[1]') }}
    env:
      BENCHMARK_WORKERS: ${{ matrix.workers }}
      BENCHMARK_BACKEND: ${{ matrix.backend }}
      BENCHMARK_SCENARIO: ${{ inputs.scenario }}
      BENCHMARK_CHANNEL: ${{ inputs.channel }}
      BENCHMARK_BROWSER_MODE: ${{ inputs.browser_mode }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Validate scenario and channel
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert(['normal-game', 'meshopt', 'extra', 'concurrency'].includes(process.env.BENCHMARK_SCENARIO));
          assert(['shell', 'chromium'].includes(process.env.BENCHMARK_CHANNEL));
          assert(['dedicated', 'shared'].includes(process.env.BENCHMARK_BROWSER_MODE));
          assert(process.env.BENCHMARK_BROWSER_MODE !== 'shared' || process.env.BENCHMARK_SCENARIO === 'concurrency' && process.env.BENCHMARK_CHANNEL === 'chromium' && process.env.BENCHMARK_BACKEND === 'gl');
          const workers = Number(process.env.BENCHMARK_WORKERS);
          assert(['1', '2'].includes(process.env.BENCHMARK_WORKERS));
          assert(Number.isFinite(workers) && Number.isInteger(workers) && [1, 2].includes(workers));
          assert(process.env.BENCHMARK_SCENARIO === 'concurrency' ? process.env.BENCHMARK_CHANNEL === 'chromium' && process.env.BENCHMARK_BACKEND === 'gl' : workers === 1);
          NODE
      - name: Verify source run and successful build
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const assert = require('node:assert/strict');
            function validateRunId(value) {
              assert.equal(value, value.trim());
              assert.match(value, /^\d+$/);
            }
            function verifySource(run, jobs, repository, workflowId, runId) {
              validateRunId(runId);
              assert.equal(String(run.id), runId);
              assert.equal(run.repository.full_name, repository);
              assert.equal(run.head_repository.full_name, repository);
              assert.equal(run.event, 'push');
              assert.equal(run.head_branch, 'main');
              assert.equal(run.workflow_id, workflowId);
              assert.equal(run.path, '.github/workflows/check.yml');
              assert.match(run.head_sha, /^[a-f0-9]{40}$/);
              assert(jobs.some(job => job.name === 'build' && job.run_id === run.id &&
                job.head_sha === run.head_sha && job.status === 'completed' && job.conclusion === 'success'));
              return run.head_sha;
            }
            const fixture = {
              id: 123, repository: { full_name: 'owner/repo' }, head_repository: { full_name: 'owner/repo' },
              event: 'push', head_branch: 'main', workflow_id: 456, path: '.github/workflows/check.yml',
              head_sha: 'a'.repeat(40), conclusion: 'cancelled'
            };
            const build = { name: 'build', run_id: 123, head_sha: fixture.head_sha, status: 'completed', conclusion: 'success' };
            const verify = (run = fixture, jobs = [build]) => verifySource(run, jobs, 'owner/repo', 456, '123');
            assert.equal(verify(), fixture.head_sha);
            assert.equal(verify({ ...fixture, conclusion: 'success' }), fixture.head_sha);
            for (const value of ['', '1;echo bad', '-1', '1.2', '123\n']) assert.throws(() => validateRunId(value));
            for (const patch of [
              { id: 124 }, { repository: { full_name: 'other/repo' } }, { head_repository: { full_name: 'other/repo' } },
              { event: 'pull_request' }, { head_branch: 'other' }, { workflow_id: 457 },
              { path: '.github/workflows/other.yml' }, { head_sha: 'invalid' }
            ]) assert.throws(() => verify({ ...fixture, ...patch }));
            assert.throws(() => verify(fixture, []));
            for (const patch of [
              { name: 'check' }, { run_id: 124 }, { head_sha: 'b'.repeat(40) },
              { status: 'in_progress' }, { conclusion: 'failure' }, { conclusion: 'cancelled' }, { conclusion: 'skipped' }
            ]) assert.throws(() => verify(fixture, [{ ...build, ...patch }]));
            console.log('Source verification self-check passed (including cancelled run / successful build)');
            const runId = process.env.SOURCE_RUN_ID;
            validateRunId(runId);
            const repo = context.repo;
            const { data: workflow } = await github.rest.actions.getWorkflow({ ...repo, workflow_id: 'check.yml' });
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: runId });
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id: runId, filter: 'latest', per_page: 100
            });
            const sha = verifySource(run, jobs, `${repo.owner}/${repo.repo}`, workflow.id, runId);
            core.setOutput('sha', sha);
            core.setOutput('run', JSON.stringify({ id: run.id, url: run.html_url, sha, conclusion: run.conclusion,
              attempt: run.run_attempt, workflowId: workflow.id, build: jobs.find(job => job.name === 'build') }));
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore source run SDK
        uses: actions/download-artifact@v4
        with:
          name: pages-sdk-${{ steps.source.outputs.sha }}
          path: .generated/moqt-sdk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Restore source run Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .pages-artifact
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: npm ci --ignore-scripts
      - name: Restore prepared output without rebuilding
        run: |
          mkdir -p dist
          tar -xf .pages-artifact/artifact.tar -C dist
          test -s dist/THIRD-PARTY-NOTICES.txt
          test -s .generated/moqt-sdk/provenance.json
          node -e "const p = require('./node_modules/@playwright/test/package.json'); if (p.version !== '1.59.1') throw Error('Unexpected Playwright pin: ' + p.version)"
      - name: Install identical headless and Mesa dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libegl1 mesa-vulkan-drivers xvfb
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const channel = process.env.BENCHMARK_CHANNEL;
          assert(['shell', 'chromium'].includes(channel));
          assert(['dedicated', 'shared'].includes(process.env.BENCHMARK_BROWSER_MODE));
          assert(process.env.BENCHMARK_BROWSER_MODE !== 'shared' || process.env.BENCHMARK_SCENARIO === 'concurrency' && process.env.BENCHMARK_CHANNEL === 'chromium' && process.env.BENCHMARK_BACKEND === 'gl');
          execFileSync('npx', ['playwright', 'install', '--with-deps', ...(channel === 'shell' ? ['--only-shell'] : []), 'chromium'], { stdio: 'inherit' });
          NODE
      - name: Select the OS lavapipe ICD for Vulkan only
        if: matrix.backend == 'vulkan'
        shell: bash
        run: |
          shopt -s nullglob
          drivers=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#drivers[@]}" -eq 1
          echo "VK_DRIVER_FILES=${drivers[0]}" >> "$GITHUB_ENV"
      - name: Generate isolated config and import the existing case
        shell: bash
        run: |
          mkdir -p .build/renderer-benchmark-local
          cat > .build/renderer-benchmark-local/playwright.config.ts <<'CONFIG'
          import { defineConfig } from '@playwright/test'
          import { fileURLToPath } from 'node:url'
          import source from '../../playwright.pages.config'

          const backend = process.env.BENCHMARK_BACKEND
          const scenario = process.env.BENCHMARK_SCENARIO
          const channel = process.env.BENCHMARK_CHANNEL
          if (!['swiftshader', 'gl', 'vulkan'].includes(backend ?? '')) throw new Error('Unknown backend')
          if (!['normal-game', 'meshopt', 'extra', 'concurrency'].includes(scenario ?? '')) throw new Error('Unknown scenario')
          if (!['shell', 'chromium'].includes(channel ?? '')) throw new Error('Unknown channel')
          const browserMode = process.env.BENCHMARK_BROWSER_MODE
          if (!['dedicated', 'shared'].includes(browserMode ?? '')) throw new Error('Unknown browser mode')
          if (browserMode === 'shared' && (scenario !== 'concurrency' || channel !== 'chromium' || backend !== 'gl')) throw new Error('Invalid shared browser settings')
          const endpoint = process.env.BENCHMARK_WS_ENDPOINT
          if (browserMode === 'shared' && !process.argv.includes('--list') && !endpoint) throw new Error('Missing shared browser endpoint')
          const address = browserMode === 'shared' && endpoint ? new URL(endpoint) : undefined
          if (address && (address.protocol !== 'ws:' || address.hostname !== '127.0.0.1' || !address.port || address.username || address.password)) throw new Error('Invalid shared browser endpoint')
          const workers = Number(process.env.BENCHMARK_WORKERS)
          if (!['1', '2'].includes(process.env.BENCHMARK_WORKERS ?? '') || !Number.isFinite(workers) || !Number.isInteger(workers) || ![1, 2].includes(workers)) throw new Error('Invalid workers')
          if (scenario === 'concurrency' ? channel !== 'chromium' || backend !== 'gl' : workers !== 1) throw new Error('Invalid concurrency settings')
          export default defineConfig(source, {
            testDir: fileURLToPath(new URL('.', import.meta.url)),
            testMatch: 'renderer.spec.ts',
            workers,
            grep: scenario === 'concurrency'
              ? /(?:normal game uses lazy real meshes, ignores legacy art flags and restores a saved mesh formation|same-session Title, Continue and New game retain the completed campaign preparation|advancing prepares the next stage before releasing the result screen)$/
              : scenario === 'meshopt'
              ? /meshopt source equivalence /
              : scenario === 'extra'
                ? /EXTRA (?:exposes every runtime role\/action and never requests sheets, audio or game services|loop boundary repeats the start pose while the interior visibly moves|shares the weak model IBL once across model switches and releases it on pagehide)$/
                : /normal game uses lazy real meshes, ignores legacy art flags and restores a saved mesh formation$/,
            outputDir: fileURLToPath(new URL(scenario === 'concurrency' ? `workers-${workers}/results` : 'results', import.meta.url)),
            reporter: [
              ['list'],
              ['json', { outputFile: fileURLToPath(new URL(scenario === 'concurrency' ? `workers-${workers}/report.json` : 'report.json', import.meta.url)) }]
            ],
            use: {
              ...(browserMode === 'shared' && endpoint ? { connectOptions: { wsEndpoint: endpoint } } : {}),
              headless: true,
              ...(channel === 'chromium' ? { channel: 'chromium' } : {}),
              launchOptions: {
                // Chromium blocks llvmpipe by default; this diagnostic deliberately measures software drivers.
                // Isolate 2D rasterization artifacts with CPU rasterization while preserving WebGL2.
                args: ['--enable-gpu', '--ignore-gpu-blocklist', '--disable-gpu-rasterization', '--use-gl=angle', `--use-angle=${backend}`, '--use-cmd-decoder=passthrough']
              }
            }
          })
          CONFIG
          cat > .build/renderer-benchmark-local/shared-browser.mjs <<'SERVER'
          import assert from 'node:assert/strict'
          import { spawn } from 'node:child_process'
          import { constants } from 'node:os'
          import { pathToFileURL } from 'node:url'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs'

          export async function runShared({ chromium, spawnChild = spawn, parent = process, env = process.env, graceMs = 5000, files = { existsSync, readFileSync, writeFileSync } }) {
            assert.equal(env.BENCHMARK_BROWSER_MODE, 'shared')
            assert.equal(env.BENCHMARK_SCENARIO, 'concurrency')
            assert.equal(env.BENCHMARK_CHANNEL, 'chromium')
            assert.equal(env.BENCHMARK_BACKEND, 'gl')
            assert(['1', '2'].includes(env.BENCHMARK_WORKERS))
            let server
            let child
            let receivedSignal
            let timer
            let status = 1
            let endpoint
            let cleanupFailed = false
            const signals = ['SIGINT', 'SIGTERM', 'SIGHUP']
            const signalChild = signal => {
              if (!child?.pid) return
              try {
                parent.kill(-child.pid, signal)
              } catch (error) {
                if (error.code !== 'ESRCH') cleanupFailed = true
              }
            }
            const onSignal = signal => {
              receivedSignal ??= signal
              if (child) {
                signalChild(signal)
                timer ??= setTimeout(() => signalChild('SIGKILL'), graceMs)
              }
            }
            const handlers = signals.map(signal => [signal, () => onSignal(signal)])
            const onExit = () => {
              signalChild('SIGKILL')
              server?.process()?.kill('SIGKILL')
            }
            for (const [signal, handler] of handlers) parent.on(signal, handler)
            parent.on('exit', onExit)
            try {
              server = await chromium.launchServer({
                headless: true, channel: 'chromium', host: '127.0.0.1', port: 0,
                handleSIGINT: false, handleSIGTERM: false, handleSIGHUP: false,
                args: ['--enable-gpu', '--ignore-gpu-blocklist', '--disable-gpu-rasterization', '--use-gl=angle', `--use-angle=${env.BENCHMARK_BACKEND}`, '--use-cmd-decoder=passthrough']
              })
              if (receivedSignal) return 128 + constants.signals[receivedSignal]
              endpoint = server.wsEndpoint()
              assert.match(endpoint, /^ws:\/\/127\.0\.0\.1:\d+\//)
              parent.stdout.write('::add-mask::' + endpoint + '\n')
              child = spawnChild('npx', ['playwright', 'test', '--config', '.build/renderer-benchmark-local/playwright.config.ts'], {
                stdio: 'inherit', detached: true, env: { ...env, BENCHMARK_WS_ENDPOINT: endpoint }
              })
              status = await new Promise(resolve => {
                child.once('error', () => resolve(1))
                child.once('close', (code, signal) => resolve(receivedSignal ? 128 + constants.signals[receivedSignal] : code ?? 128 + (constants.signals[signal] ?? 1)))
              })
              return status
            } finally {
              clearTimeout(timer)
              signalChild('SIGKILL')
              try {
                await server?.close()
              } catch {
                server?.process()?.kill('SIGKILL')
                if (status === 0) throw new Error('Shared browser cleanup failed')
              } finally {
                try {
                  const report = `.build/renderer-benchmark-local/workers-${env.BENCHMARK_WORKERS}/report.json`
                  if (endpoint && files.existsSync(report)) files.writeFileSync(report, files.readFileSync(report, 'utf8').replaceAll(endpoint, '[benchmark endpoint omitted]'))
                } catch {
                  cleanupFailed = true
                }
                for (const [signal, handler] of handlers) parent.off(signal, handler)
                parent.off('exit', onExit)
                if (cleanupFailed && status === 0) throw new Error('Shared browser process/report cleanup failed')
              }
            }
          }

          if (process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href) {
            try {
              const { chromium } = await import('playwright')
              process.exitCode = await runShared({ chromium })
            } catch {
              console.error('Shared browser wrapper failed (endpoint omitted)')
              process.exitCode = 1
            }
          }
          SERVER
          cat > .build/renderer-benchmark-local/renderer.spec.ts <<'SPEC'
          import { test, expect } from '@playwright/test'
          import { appendFileSync, writeFileSync } from 'node:fs'

          if (process.env.BENCHMARK_SCENARIO === 'meshopt') {
            await import('../../tests/tower-meshopt-equivalence.spec')
          } else if (process.env.BENCHMARK_SCENARIO === 'extra') {
            await import('../../tests/tower-title-e2e.spec')
            await import('../../tests/tower-real3d-game.spec')
          } else {
            await import('../../tests/tower-real3d-game.spec')
          }

          if (process.env.BENCHMARK_SCENARIO === 'extra') {
            test.beforeEach(async ({ page }, testInfo) => {
              const prefix = 'EXTRA_WEBGL_DIAGNOSTIC:'
              const eventLimit = 40_000
              const path = testInfo.outputPath('webgl-calls.jsonl')
              try {
                writeFileSync(path, JSON.stringify({ type: 'metadata', eventLimit, callLimitPerDocument: 10_000 }) + '\n')
              } catch (error) {
                console.error('WebGL diagnostic initialization failed:', error)
                return
              }
              let received = 0
              page.on('console', message => {
                const text = message.text()
                if (!text.startsWith(prefix) || received > eventLimit) return
                try {
                  const event = received === eventLimit
                    ? { type: 'truncated', scope: 'controller', eventLimit }
                    : JSON.parse(text.slice(prefix.length))
                  received++
                  appendFileSync(path, JSON.stringify(event) + '\n')
                } catch (error) {
                  console.error('WebGL diagnostic write failed:', error)
                }
              })
              await page.addInitScript(({ prefix, callLimit }) => {
                const emit = (event: object) => {
                  try { console.log(prefix + JSON.stringify({ ...event, time: performance.now() })) } catch {}
                }
                let calls = 0
                let truncated = false
                emit({ type: 'metadata', timeOrigin: performance.timeOrigin, callLimit })
                if (typeof WebGL2RenderingContext === 'undefined') return
                const prototype = WebGL2RenderingContext.prototype as unknown as Record<string, (...args: unknown[]) => unknown>
                for (const method of ['linkProgram', 'getProgramInfoLog', 'getShaderInfoLog', 'getProgramParameter']) {
                  const original = prototype[method]
                  prototype[method] = function (this: WebGL2RenderingContext, ...args: unknown[]) {
                    const recorded = calls < callLimit
                    const id = recorded ? ++calls : 0
                    if (!recorded && !truncated) {
                      truncated = true
                      emit({ type: 'truncated', scope: 'document', callLimit })
                    }
                    if (recorded) emit({ id, method, phase: 'start' })
                    let threw = true
                    try {
                      const result = Reflect.apply(original, this, args)
                      threw = false
                      return result
                    } finally {
                      if (recorded) emit({ id, method, phase: 'end', threw })
                    }
                  }
                }
              }, { prefix, callLimit: 10_000 })
            })
          }

          test.afterEach(async ({ page, browser }, testInfo) => {
            const originalFailed = testInfo.status !== testInfo.expectedStatus
            try {
              const selector = ['normal-game', 'concurrency'].includes(process.env.BENCHMARK_SCENARIO ?? '') ? '#field > canvas' : '#viewer-canvas'
              const renderer = await page.locator(selector).evaluate((canvas: HTMLCanvasElement) => {
                const context = canvas.getContext('webgl2')
                if (!context || context.isContextLost()) throw new Error('No live game WebGL2 context')
                const debug = context.getExtension('WEBGL_debug_renderer_info')
                if (!debug) throw new Error('WEBGL_debug_renderer_info unavailable on the game canvas')
                return {
                  renderer: String(context.getParameter(debug.UNMASKED_RENDERER_WEBGL)),
                  vendor: String(context.getParameter(debug.UNMASKED_VENDOR_WEBGL))
                }
              }, undefined, { timeout: 10_000 })
              const evidence = { backend: process.env.BENCHMARK_BACKEND, ...renderer }
              console.log('Game renderer:', JSON.stringify(evidence))
              await testInfo.attach('renderer', { body: JSON.stringify(evidence, null, 2), contentType: 'application/json' })
              if (evidence.backend === 'swiftshader') {
                expect(renderer.renderer).toMatch(/SwiftShader/i)
              } else if (evidence.backend === 'gl') {
                expect(renderer.renderer).toMatch(/llvmpipe/i)
                expect(renderer.renderer).toMatch(/OpenGL/i)
                expect(renderer.renderer).not.toMatch(/Vulkan|SwiftShader/i)
              } else {
                expect(evidence.backend).toBe('vulkan')
                expect(renderer.renderer).toMatch(/Vulkan/i)
                expect(renderer.renderer).toMatch(/llvmpipe|lavapipe/i)
                expect(renderer.renderer).not.toMatch(/SwiftShader/i)
              }
            } catch (error) {
              console.error('Renderer verification failed:', error)
              if (!originalFailed) throw error
            } finally {
              try {
                const session = await browser.newBrowserCDPSession()
                try {
                  const { gpu } = await session.send('SystemInfo.getInfo')
                  await testInfo.attach('gpu-feature-status', { body: JSON.stringify(gpu.featureStatus, null, 2), contentType: 'application/json' })
                } finally {
                  await session.detach()
                }
              } catch (error) {
                console.error('GPU feature status diagnostic failed:', error)
              }
            }
          })
          SPEC
      - name: Confirm exact original tests are selected
        run: |
          npx playwright test --config .build/renderer-benchmark-local/playwright.config.ts --list --reporter=json > .build/renderer-benchmark-local/selection.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('.build/renderer-benchmark-local/selection.json', 'utf8'));
          const specs = suites => suites.flatMap(suite => [...suite.specs, ...specs(suite.suites ?? [])]);
          const selected = specs(report.suites);
          const scenario = process.env.BENCHMARK_SCENARIO;
          assert(['normal-game', 'meshopt', 'extra', 'concurrency'].includes(scenario));
          const expected = scenario === 'concurrency'
            ? ["normal game uses lazy real meshes, ignores legacy art flags and restores a saved mesh formation","same-session Title, Continue and New game retain the completed campaign preparation","advancing prepares the next stage before releasing the result screen"]
            : scenario === 'meshopt'
            ? ['soldier walk', 'slime walk', 'mage attack', 'tank walk', 'dragon breath'].map(name => `${name} preserves source poses and rendered appearance`)
            : scenario === 'extra'
              ? [
                  'EXTRA exposes every runtime role/action and never requests sheets, audio or game services',
                  'EXTRA loop boundary repeats the start pose while the interior visibly moves',
                  'EXTRA shares the weak model IBL once across model switches and releases it on pagehide'
                ]
              : ['normal game uses lazy real meshes, ignores legacy art flags and restores a saved mesh formation'];
          assert.equal(report.errors.length, 0);
          assert.equal(selected.length, expected.length);
          assert(selected.every(spec => spec.tests.length === 1));
          assert.deepEqual(selected.map(spec => spec.title).sort(), expected.sort());
          NODE
      - name: Run the same case under X11 with headless Chromium
        shell: bash
        run: |
          if [ "$BENCHMARK_SCENARIO" != concurrency ]; then
            xvfb-run -a npx playwright test --config .build/renderer-benchmark-local/playwright.config.ts
            exit 0
          fi
          status=0
          : > .build/renderer-benchmark-local/passes.jsonl
          for workers in "$BENCHMARK_WORKERS" "$((3 - BENCHMARK_WORKERS))"; do
            pass_started=$(node -p 'Date.now()')
            if [ "$BENCHMARK_BROWSER_MODE" = shared ]; then
              command=(node .build/renderer-benchmark-local/shared-browser.mjs)
            else
              command=(npx playwright test --config .build/renderer-benchmark-local/playwright.config.ts)
            fi
            if BENCHMARK_WORKERS="$workers" xvfb-run -a "${command[@]}"; then
              pass_status=0
            else
              pass_status=$?
            fi
            pass_finished=$(node -p 'Date.now()')
            printf '{"workers":%s,"exitCode":%s,"wallMs":%s,"browserMode":"%s"}\n' "$workers" "$pass_status" "$((pass_finished - pass_started))" "$BENCHMARK_BROWSER_MODE" >> .build/renderer-benchmark-local/passes.jsonl
            if [ "$status" -eq 0 ]; then status=$pass_status; fi
          done
          exit "$status"
      - name: Record run, source and backend settings
        if: always()
        env:
          SOURCE_METADATA: ${{ steps.source.outputs.run }}
          BENCHMARK_RUN_ID: ${{ github.run_id }}
          BENCHMARK_RUN_ATTEMPT: ${{ github.run_attempt }}
          BENCHMARK_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p .build/renderer-benchmark-local
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { cpus } from 'node:os';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const backend = process.env.BENCHMARK_BACKEND;
          const scenario = process.env.BENCHMARK_SCENARIO;
          const channel = process.env.BENCHMARK_CHANNEL;
          assert(['normal-game', 'meshopt', 'extra', 'concurrency'].includes(scenario));
          assert(['shell', 'chromium'].includes(channel));
          assert(['dedicated', 'shared'].includes(process.env.BENCHMARK_BROWSER_MODE));
          assert(process.env.BENCHMARK_BROWSER_MODE !== 'shared' || process.env.BENCHMARK_SCENARIO === 'concurrency' && process.env.BENCHMARK_CHANNEL === 'chromium' && process.env.BENCHMARK_BACKEND === 'gl');
          const workers = Number(process.env.BENCHMARK_WORKERS);
          assert(['1', '2'].includes(process.env.BENCHMARK_WORKERS));
          assert(Number.isFinite(workers) && Number.isInteger(workers) && [1, 2].includes(workers));
          assert(process.env.BENCHMARK_SCENARIO === 'concurrency' ? process.env.BENCHMARK_CHANNEL === 'chromium' && process.env.BENCHMARK_BACKEND === 'gl' : workers === 1);
          const cpu = cpus();
          const metadata = {
            sourceRunId: process.env.SOURCE_RUN_ID,
            source: process.env.SOURCE_METADATA ? JSON.parse(process.env.SOURCE_METADATA) : null,
            benchmarkRunId: process.env.BENCHMARK_RUN_ID, attempt: process.env.BENCHMARK_RUN_ATTEMPT,
            jobStatus: process.env.BENCHMARK_JOB_STATUS, backend, scenario, channel, workers, node: process.version,
            browserMode: process.env.BENCHMARK_BROWSER_MODE,
            browserOwnership: process.env.BENCHMARK_BROWSER_MODE === 'shared' ? 'one-server-per-pass' : 'one-browser-per-worker',
            ...(process.env.BENCHMARK_BROWSER_MODE === 'shared' ? {
              browserServer: { host: '127.0.0.1', port: 0, handleSIGINT: false, handleSIGTERM: false, handleSIGHUP: false }
            } : {}),
            ...(scenario === 'concurrency' ? {
              workerOrder: [workers, 3 - workers],
              passes: existsSync('.build/renderer-benchmark-local/passes.jsonl')
                ? readFileSync('.build/renderer-benchmark-local/passes.jsonl', 'utf8').trim().split('\n').filter(Boolean).map(line => JSON.parse(line))
                : []
            } : {}),
            cpu: { logicalCount: cpu.length, model: cpu[0]?.model ?? null },
            playwrightChannel: channel === 'chromium' ? 'chromium' : null,
            headless: true, display: 'xvfb-run -a',
            args: ['--enable-gpu', '--ignore-gpu-blocklist', '--disable-gpu-rasterization', '--use-gl=angle', `--use-angle=${backend}`, '--use-cmd-decoder=passthrough'],
            environment: Object.fromEntries(['LIBGL_ALWAYS_SOFTWARE', 'GALLIUM_DRIVER', 'VK_DRIVER_FILES'].map(key => [key, process.env[key] ?? null]))
          };
          writeFileSync('.build/renderer-benchmark-local/metadata.json', JSON.stringify(metadata, null, 2));
          writeFileSync('.build/renderer-benchmark-local/mesa-packages.txt', execFileSync('dpkg-query', ['-W', 'libgl1-mesa-dri', 'libegl1', 'mesa-vulkan-drivers', 'xvfb'], { encoding: 'utf8' }));
          NODE
      - name: Preserve report, renderer, traces and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.backend }}${{ inputs.scenario == 'concurrency' && format('-first-workers-{0}', matrix.workers) || '' }}${{ inputs.browser_mode == 'shared' && '-shared' || '' }}
          path: .build/renderer-benchmark-local/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
