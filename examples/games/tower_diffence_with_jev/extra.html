<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EXTRA · smart defence with jev</title>
  </head>
  <body>
    <header class="extra-header">
      <a href="./index.html">← Title</a><span>MoQ Games / smart defence with jev</span>
    </header>
    <main class="extra-layout">
      <section class="extra-intro">
        <h1>EXTRA</h1>
        <p>3D model viewer</p>
        <p class="extra-note">本編と同じ3Dモデルと動作を確認できます。</p>
      </section>
      <section class="extra-controls" aria-label="Model selection">
        <label>Character<select id="viewer-role"></select></label>
        <label>Motion<select id="viewer-motion"></select></label>
        <button id="viewer-reset">Reset camera</button>
        <button id="viewer-retry" hidden>Retry</button>
      </section>
      <section class="extra-stage" aria-label="3D model preview">
        <canvas
          id="viewer-canvas"
          tabindex="0"
          aria-label="3D model. Drag to rotate, scroll or pinch to zoom. Arrow keys rotate; plus and minus zoom."
        ></canvas>
        <p id="viewer-status" role="status">3Dモデルを読み込み中…</p>
      </section>
      <p class="extra-note">ドラッグで回転 · スクロール／ピンチで拡大 · 矢印キーで回転 · ＋／−で拡大縮小</p>
      <section class="extra-transport" aria-label="Playback">
        <button id="viewer-play" disabled>Play</button>
        <button id="viewer-restart" disabled>Restart</button>
        <input
          id="viewer-timeline"
          type="range"
          min="0"
          max="1"
          value="0"
          step="0.001"
          disabled
          aria-label="Animation position"
        />
        <output id="viewer-time">0.00 s</output>
        <label
          >Speed<select id="viewer-speed">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
          </select></label
        >
      </section>
      <p id="viewer-missing" class="extra-note"></p>
      <p class="extra-note">遠征の保存データは変更しません。</p>
    </main>
    <script type="module" src="./src/ui/ExtraViewer.ts"></script>
  </body>
</html>
