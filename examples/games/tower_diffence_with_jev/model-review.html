<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Actual 3D model review</title>
    <style>
      body {
        margin: 0;
        background: #12212a;
        color: #e8f6ee;
        font: 16px system-ui;
      }
      main {
        max-width: 900px;
        margin: 24px auto;
      }
      canvas {
        width: 100%;
        height: auto;
        background: #617b64;
      }
      button,
      select {
        font: inherit;
        padding: 8px;
        margin: 6px;
      }
      #status {
        min-height: 48px;
      }
      a {
        color: #9fddd8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Actual 3D model review</h1>
      <p>Animated geometry inspection. This isolated review does not certify the complete game roster.</p>
      <label
        >Motion
        <select id="motion">
          <option>idle</option>
          <option>walk</option>
          <option>attack</option>
          <option>death</option>
        </select></label
      ><button id="replay">Replay</button><button id="turn">Turn 45°</button>
      <div id="stage"></div>
      <p id="status" role="status">Loading model…</p>
    </main>
    <script type="module" src="./src/review/ModelReview.ts"></script>
  </body>
</html>
