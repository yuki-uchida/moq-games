<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1035" />
    <meta
      name="description"
      content="星のハムハム — 64×64のモダンピクセルで描く、ステージギミック最重視の2Dアクション。歯で木を倒し、地面を掘り、配管を破き、蜂を怒らせよう。全10ステージ。"
    />
    <title>星のハムハム</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Cpath fill='%231b1035' d='M0 0h16v16H0z'/%3E%3Cpath fill='%23ffd45e' d='M8 2l1.6 3.6L13 6l-2.6 2.8.8 3.9L8 11l-3.2 1.7.8-3.9L3 6l3.4-.4z'/%3E%3Cpath fill='%23ff9ecb' d='M3 11h10v3H3z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main id="app">
      <div id="stage-wrap">
        <canvas id="game" width="640" height="360" aria-label="星のハムハムのフィールド"></canvas>

        <section id="hud" class="hud" aria-label="ゲームの状態" hidden>
          <div class="hud-top">
            <div class="hearts" id="hearts" aria-label="たいりょく"></div>
            <div class="hud-stage"><b id="hud-stage-no">1</b><span id="hud-stage-name">おふくろの追撃</span></div>
            <div class="hud-actions">
              <button id="mute" class="icon-button" type="button" aria-label="音をミュート" aria-pressed="false">
                🔊
              </button>
              <button id="pause" class="icon-button" type="button" aria-label="一時停止">⏸</button>
            </div>
          </div>
          <div id="boss-bar" class="boss-bar" hidden>
            <div class="boss-name"><b id="boss-name">ママ・ハム代</b><small id="boss-title">おふくろ</small></div>
            <div class="boss-meter"><i id="boss-trail"></i><i id="boss-fill"></i></div>
          </div>
          <div id="bite-meter" class="bite-meter" aria-label="かじる準備">
            <i id="bite-fill"></i><span>かじる</span>
          </div>
          <div id="banner" class="banner" aria-hidden="true"></div>
          <div id="toast" class="toast" role="status" aria-live="polite"></div>
          <div id="touch-controls" class="touch-controls" aria-hidden="true" hidden>
            <div class="touch-dpad">
              <button class="touch-key" data-key="left" aria-label="ひだり">◀</button>
              <button class="touch-key" data-key="right" aria-label="みぎ">▶</button>
            </div>
            <div class="touch-actions">
              <button class="touch-key bite" data-key="bite" aria-label="かじる">かじる</button>
              <button class="touch-key jump" data-key="jump" aria-label="ジャンプ">ジャンプ</button>
            </div>
          </div>
        </section>
        <section id="title-screen" class="screen title-screen" aria-labelledby="title-logo">
          <div class="title-shade" aria-hidden="true"></div>
          <h1 id="title-logo" class="title-logo">
            <span class="sr-only">星のハムハム</span>
            <span class="logo-art" aria-hidden="true"
              ><img id="logo-img" class="logo-img" alt="" /><i class="logo-shine"></i
            ></span>
          </h1>
          <div class="title-bottom">
            <div class="menu title-menu">
              <button id="continue" class="pxbtn" type="button" hidden>つづきから</button>
              <button id="start" class="pxbtn" type="button">はじめから</button>
              <button id="help-open" class="pxbtn" type="button">あそびかた</button>
            </div>
            <p class="save-note" id="save-note" role="status"></p>
          </div>
          <footer class="title-foot">
            <a class="home-link" id="home-link" href="../../../index.html"><span>ゲーム一覧</span></a>
            <small class="credit">ドット絵も音も、ぜんぶプログラムでかいたよ</small>
          </footer>
        </section>

        <section id="select-screen" class="screen select-screen" aria-labelledby="select-title" hidden>
          <header class="select-head">
            <button id="select-back" class="pxbtn pxbtn-small" type="button">タイトル</button>
            <h2 id="select-title" class="headline">ステージをえらぶ</h2>
            <p class="select-progress" id="select-progress"></p>
          </header>
          <div class="select-scroll">
            <div id="stage-grid" class="stage-grid" role="list"></div>
          </div>
        </section>

        <section id="story-screen" class="screen story-screen" aria-labelledby="story-title" hidden>
          <div class="story-layout">
            <div class="story-art">
              <canvas
                id="story-art"
                class="diorama"
                width="320"
                height="160"
                role="img"
                aria-label="お話のさし絵"
              ></canvas>
            </div>
            <div class="story-box" id="story-box">
              <header class="story-head">
                <p class="kicker" id="story-kicker">第1話</p>
                <h2 id="story-title" class="story-title">おふくろの追撃</h2>
              </header>
              <div id="story-pages" class="story-pages" aria-live="polite"></div>
              <div class="story-foot">
                <div id="story-dots" class="dots" aria-hidden="true"></div>
                <button id="story-skip" class="pxbtn pxbtn-small" type="button">スキップ</button>
                <button id="story-next" class="pxbtn pxbtn-gold" type="button">つぎへ</button>
              </div>
            </div>
          </div>
        </section>

        <section id="result-screen" class="screen result-screen" aria-labelledby="result-title" hidden>
          <div class="result-card paper-card">
            <p class="kicker" id="result-kicker">ステージ 1</p>
            <h2 id="result-title" class="headline">ステージクリア！</h2>
            <p class="result-stage" id="result-stage"></p>
            <ul id="result-stats" class="tally"></ul>
            <div id="result-stars" class="result-stars"></div>
            <p id="result-text" class="result-text"></p>
            <div class="buttons">
              <button id="result-next" class="pxbtn pxbtn-gold" type="button">つぎのステージへ</button>
              <button id="result-retry" class="pxbtn" type="button">もういちど</button>
              <button id="result-select" class="pxbtn" type="button">ステージ選択</button>
            </div>
          </div>
        </section>

        <section id="dead-screen" class="screen dead-screen" aria-labelledby="dead-title" hidden>
          <div class="dead-card night-panel">
            <div class="dead-art" id="dead-art"></div>
            <div class="dead-body">
              <p class="kicker">ゲームオーバー</p>
              <h2 id="dead-title" class="headline">やられちゃった…</h2>
              <p id="dead-text" class="dead-text">ハム彦は巣にもどって少し休もう。</p>
              <div class="buttons">
                <button id="dead-retry" class="pxbtn pxbtn-gold" type="button">リトライ</button>
                <button id="dead-select" class="pxbtn" type="button">ステージ選択</button>
              </div>
            </div>
          </div>
        </section>

        <section id="ending-screen" class="screen ending-screen" aria-labelledby="ending-title" hidden>
          <div class="story-layout">
            <div class="story-art">
              <canvas
                id="ending-art"
                class="diorama"
                width="320"
                height="160"
                role="img"
                aria-label="ハム彦、ハム姫、ハム代のさし絵"
              ></canvas>
              <div id="ending-credits" class="credits" aria-label="スタッフ" hidden></div>
            </div>
            <div class="story-box" id="ending-box">
              <header class="story-head">
                <p class="kicker">エンディング</p>
                <h2 id="ending-title" class="story-title">星の下の、あたたかい巣</h2>
              </header>
              <div id="ending-pages" class="story-pages" aria-live="polite"></div>
              <ul id="ending-stats" class="tally ending-stats" hidden></ul>
              <div class="story-foot">
                <div id="ending-dots" class="dots" aria-hidden="true"></div>
                <button id="ending-next" class="pxbtn pxbtn-gold" type="button">つぎへ</button>
                <button id="ending-select" class="pxbtn pxbtn-gold" type="button" hidden>ステージ選択へ</button>
                <button id="ending-title-button" class="pxbtn" type="button" hidden>タイトルへ</button>
              </div>
            </div>
          </div>
        </section>

        <section id="pause-screen" class="screen pause-screen" aria-labelledby="pause-title" hidden>
          <div class="pause-card night-panel" role="dialog" aria-modal="true" aria-labelledby="pause-title">
            <div class="pause-main">
              <h2 id="pause-title" class="headline">ポーズ</h2>
              <div class="menu">
                <button id="pause-resume" class="pxbtn pxbtn-gold" type="button">つづける</button>
                <button id="pause-retry" class="pxbtn" type="button">やりなおす</button>
                <button id="pause-select" class="pxbtn" type="button">ステージ選択</button>
              </div>
            </div>
            <div class="pause-side">
              <div class="volumes" id="volumes"></div>
              <ul class="keys-mini" id="pause-keys"></ul>
            </div>
          </div>
        </section>

        <section id="help-screen" class="screen help-screen" aria-labelledby="help-title" hidden>
          <div class="help-card night-panel" role="dialog" aria-modal="true" aria-labelledby="help-title">
            <header class="help-head">
              <h2 id="help-title" class="headline">あそびかた</h2>
              <button id="help-close" class="pxbtn pxbtn-small" type="button" aria-label="閉じる">とじる</button>
            </header>
            <div class="help-scroll">
              <section class="help-section">
                <h3>そうさ</h3>
                <ul id="help-moves" class="help-moves"></ul>
              </section>
              <section class="help-section">
                <h3>ギミック</h3>
                <ul id="help-gimmicks" class="help-gimmicks"></ul>
              </section>
              <p class="help-note">水に入るとぷかぷか浮くよ。蜂はハム彦もさすから気をつけて！</p>
            </div>
            <div class="help-foot">
              <button id="help-done" class="pxbtn pxbtn-gold" type="button">わかった！</button>
            </div>
          </div>
        </section>
      </div>
      <noscript>星のハムハムをあそぶには JavaScript をオンにしてください。</noscript>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
